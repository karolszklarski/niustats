<body>
<pre>
sn,date,distance,battery
<script>
    // The same trips as on the home page: the stored ones when scooters and trips are both stored,
    // otherwise the example data.
    const storedTrips = localStorage.getItem('trips');
    const useStoredData = localStorage.getItem('vehicles') !== null && storedTrips !== null;
    const trips = JSON.parse(useStoredData ? storedTrips : exampleTrips);
    Object.keys(trips).forEach(function (sn) {
        trips[sn].forEach(function (t) {
            document.write(sn + ',' + t.d + ',' + t.m + ',' + t.b + '\n');
        })
    });
</script>
</pre>
